<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout &mdash; Organic</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a class="brand" href="index.html">Organic</a>
    <nav class="main-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#products">Shop</a></li>
        <li><a href="index.html#about">About</a></li>
        <li><a href="admin.html">Admin</a></li>
      </ul>
    </nav>
    <div class="header-actions">
      <a class="icon-btn" href="cart.html" aria-label="View cart">
        🛒<span class="cart-count" data-cart-count>0</span>
      </a>
    </div>
  </div>
</header>

<section class="page-hero">
  <div class="container"><h1>Checkout</h1></div>
</section>

<section class="section" style="padding-top:48px;">
  <div class="container">
    <div id="checkout-content">
      <form class="form-card" id="checkout-form">
        <div id="checkout-summary" style="margin-bottom:20px;"></div>

        <div class="field">
          <label for="name">Full name</label>
          <input id="name" name="name" type="text" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required>
        </div>
        <div class="field">
          <label for="address">Delivery address</label>
          <textarea id="address" name="address" rows="3" required></textarea>
        </div>

        <div class="form-error hidden" id="checkout-error"></div>

        <button class="btn btn-primary" type="submit" style="width:100%;">Place Order</button>
      </form>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">&copy; 2026 Organic Food Shop. All rights reserved.</div>
  </div>
</footer>

<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/cart-store.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
